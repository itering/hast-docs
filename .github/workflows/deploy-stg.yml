name: Deploy docs staging
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, itering-ci]
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - name: Check, export and deploy staging
        uses: darwinia-network/devops/actions/smart-vercel@c95f58a0786a9ddbaf0a8271276dc2774c4a6bf0
        with:
          node_version: 24
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_group: itering
          script_install: pnpm install --frozen-lockfile
          script_build: pnpm check && pnpm test && pnpm build
          dist_path: out
          vercel_json_path: vercel.json
          project_name: hast-docs
          alias_domain: hast-docs-stg,docs-stg.hast.so
          preview_output: true
          enable_cache: false
        env:
          NEXT_PUBLIC_DOCS_URL: https://docs-stg.hast.so
          NEXT_PUBLIC_SITE_URL: https://stg.hast.so
          NEXT_PUBLIC_AIP_URL: https://aip-stg.hast.so
