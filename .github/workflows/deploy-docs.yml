name: Deploy exact docs source
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      staging_run_id:
        type: string
        default: ''
      product_release:
        type: string
        default: ''
    secrets:
      VERCEL_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: hast-docs-${{ inputs.target }}
  cancel-in-progress: false
  queue: max
jobs:
  deploy:
    environment: ${{ inputs.target }}
    runs-on: [self-hosted, Linux, X64, itering-ci]
    timeout-minutes: 30
    env:
      DOCS_SOURCE_SHA: ${{ inputs.source_sha }}
      DOCS_TARGET: ${{ inputs.target }}
      DOCS_PRODUCT_RELEASE: ${{ inputs.product_release }}
      DOCS_STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      NEXT_PUBLIC_DOCS_ENV: ${{ inputs.target }}
      NEXT_PUBLIC_DOCS_URL: ${{ inputs.target == 'production' && 'https://docs.hast.so' || 'https://docs-stg.hast.so' }}
      NEXT_PUBLIC_SITE_URL: ${{ inputs.target == 'production' && 'https://hast.so' || 'https://stg.hast.so' }}
      NEXT_PUBLIC_AIP_URL: ${{ inputs.target == 'production' && 'https://aip.hast.so' || 'https://aip-stg.hast.so' }}
    steps:
      - name: Fetch trusted release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: authority
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Authorize exact source before deployment credentials
        working-directory: authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/docs-release.ts authorize
      - name: Require the selected environment deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"
      - name: Fetch exact approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Build and deploy
        id: vercel
        uses: darwinia-network/devops/actions/smart-vercel@c95f58a0786a9ddbaf0a8271276dc2774c4a6bf0
        with:
          node_version: 24
          vercel_token: ${{ secrets.VERCEL_TOKEN }}
          vercel_group: itering
          cache_type: pnpm
          workdir: source
          script_install: corepack pnpm install --frozen-lockfile
          script_build: |
            corepack pnpm check
            corepack pnpm test
            corepack pnpm build
            node ../authority/scripts/docs-release.ts stamp
          dist_path: out
          vercel_json_path: vercel.json
          preview_output: true
          project_name: hast-docs
          prod_mode: ${{ inputs.target == 'production' && 'true' || '' }}
          alias_domain: ${{ inputs.target == 'production' && 'docs.hast.so' || 'hast-docs-stg,docs-stg.hast.so' }}
          enable_cache: false
      - name: Accept the public deployed revision
        env:
          DOCS_DEPLOYMENT_LINKS: ${{ steps.vercel.outputs.PREVIEW_LINK }}
        run: node --experimental-strip-types authority/scripts/docs-release.ts accept
